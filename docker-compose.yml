# ── 披呦 Docker Compose / Piyou Docker Compose ──
# 一鍵啟動前後端開發或部署環境
#   開發: docker compose up --build
#   背景: docker compose up -d --build

services:
  backend:
    build: ./backend
    container_name: piyou-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # 開發時掛載原始碼，支援 hot-reload
      - ./backend:/app
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build: ./frontend
    container_name: piyou-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
