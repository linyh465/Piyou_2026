server {
    # Railway 透過 PORT 環境變數指定埠號（由 envsubst 注入）
    # Railway assigns port via PORT env var (injected by envsubst)
    listen ${PORT};
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── 安全標頭 / Security Headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.railway.app; font-src 'self'; worker-src 'self'; manifest-src 'self'" always;

    # ── API 反向代理 / API Reverse Proxy ──
    # Docker Compose: BACKEND_URL=http://backend:8000 （內部 DNS）
    # Railway: BACKEND_URL=https://你的後端.railway.app （公開 URL）
    # 使用 set + resolver 延遲 DNS 解析，避免啟動時因主機名無法解析而崩潰
    location /api/ {
        resolver ${NAMESERVER} valid=10s ipv6=off;
        set $backend_upstream "${BACKEND_URL}";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA fallback — 所有路徑都導回 index.html
    # Railway 環境中前端直接呼叫後端 public URL，不需要反向代理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 靜態資源快取
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
