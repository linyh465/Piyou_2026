# ══════════════════════════════════════════
#  披呦 CI / Piyou Continuous Integration
#  前後端測試自動化 / Automated frontend & backend tests
# ══════════════════════════════════════════
name: CI

on:
  push:
    branches: [main, develop, railway-staging]
  pull_request:
    branches: [main, develop, railway-staging]

jobs:
  # ── 後端測試 / Backend Tests ──
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key' }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID || '' }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET || '' }}
        run: python -m pytest tests/ -v

  # ── 前端測試 / Frontend Tests ──
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run
