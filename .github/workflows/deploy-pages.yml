# ══════════════════════════════════════════
#  GitHub Pages 自動部署 / GitHub Pages Auto Deploy
#  推送到 main 且 frontend/ 有變更時觸發
#  Triggers on push to main when frontend/ changes
# ══════════════════════════════════════════
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/**
  # 手動觸發 / Manual trigger
  workflow_dispatch:

# 強制 GitHub Actions 使用 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write   # 寫入 gh-pages 分支 / Write to gh-pages branch
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Koyeb 後端 API URL / Koyeb backend API URL
          # 格式：https://<your-app>-<hash>.koyeb.app/api/v1
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # GitHub Pages base path
          # 有自訂網域留空（預設 /）/ Leave empty if custom domain (default /)
          # 無自訂網域填 /<repo-name>/ / Set /<repo-name>/ if no custom domain
          VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH || '/' }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          # 保留歷史紀錄 / Keep history
          keep_files: false
          # 推送到 gh-pages 分支 / Push to gh-pages branch
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.sha }}"
