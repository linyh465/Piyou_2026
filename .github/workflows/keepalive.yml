# ══════════════════════════════════════════
#  Keepalive — 防止免費方案服務暫停
#  Prevent free-tier services from going idle
#
#  目標 / Targets:
#  - Koyeb Free：無活動一段時間後冷啟動，ping 維持活躍
#    Koyeb Free: cold starts after inactivity, ping to keep alive
#  - Supabase Free：閒置 7 天後暫停，ping 維持活躍
#    Supabase Free: pauses after 7 days idle, ping to keep alive
#
#  升級到付費方案後可停用此 workflow
#  Disable this workflow after upgrading to paid plans
# ══════════════════════════════════════════
name: Keepalive

on:
  schedule:
    # 每 6 小時執行一次 / Run every 6 hours
    - cron: '0 */6 * * *'
  # 手動觸發 / Manual trigger
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Koyeb backend
        # secrets.KOYEB_API_URL 格式：https://<app>-<hash>.koyeb.app
        # 若尚未設定則跳過 / Skip if not set yet
        if: ${{ secrets.KOYEB_API_URL != '' }}
        run: |
          echo "Pinging Koyeb backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.KOYEB_API_URL }}/health" \
            --max-time 15 || echo "000")
          echo "Koyeb response: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "Warning: Koyeb ping failed (timeout or connection error)"
          else
            echo "OK: Koyeb is alive"
          fi

      - name: Ping Supabase (keep database active)
        # secrets.SUPABASE_URL 格式：https://xxxx.supabase.co
        # 使用 REST API health endpoint / Uses REST API health endpoint
        if: ${{ secrets.SUPABASE_PING_URL != '' }}
        run: |
          echo "Pinging Supabase..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_PING_URL }}" \
            --max-time 15 || echo "000")
          echo "Supabase response: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "Warning: Supabase ping failed (timeout or connection error)"
          else
            echo "OK: Supabase is alive"
          fi
